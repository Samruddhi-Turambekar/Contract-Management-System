<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ContractPro | Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="brand login-brand">
            Contract<span>Pro</span>
        </div>


        <h1>Welcome Back</h1>


        <p class="subtitle">
            Enterprise Contract Management System
        </p>


        <form id="loginForm">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >



            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


            <p id="message"></p>


        </form>


        <div class="login-footer">

            <p>
                Secure access for managers and employees
            </p>

        </div>


    </div>


</div>



<script src="script.js"></script>


<script>


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {


        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const message =
            document
            .getElementById("message");


        const loginButton =
            document
            .getElementById("loginButton");


        /* Clear old message */

        message.innerText = "";


        /* Disable button */

        loginButton.disabled = true;

        loginButton.innerText = "Logging in...";


        try {


            const response =
                await fetch(
                    API + "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })
                    }
                );


            /* =================================================
               LOGIN SUCCESS
            ================================================= */

            if (response.ok) {


                const user =
                    await response.json();


                console.log(
                    "Logged in user:",
                    user
                );


                /* Save user information */

                localStorage.setItem(
                    "userId",
                    user.userId
                );


                localStorage.setItem(
                    "userRole",
                    user.role
                );


                localStorage.setItem(
                    "userName",
                    user.name
                );


                localStorage.setItem(
                    "userEmail",
                    user.email
                );


                /* Show success */

                message.style.color = "green";

                message.innerText =
                    "Login successful!";


                /* =================================================
                   REDIRECT BASED ON ROLE
                ================================================= */

                setTimeout(function() {


                    if (user.role === "MANAGER") {

                        window.location.href =
                            "manager-dashboard.html";

                    }

                    else if (user.role === "EMPLOYEE") {

                        window.location.href =
                            "employee-dashboard.html";

                    }

                    else {

                        message.style.color = "red";

                        message.innerText =
                            "Invalid user role.";

                    }


                }, 500);


            }


            /* =================================================
               LOGIN FAILED
            ================================================= */

            else {


                let errorMessage =
                    "Invalid email or password";


                try {

                    const error =
                        await response.json();

                    if (error.message) {

                        errorMessage =
                            error.message;

                    }

                } catch (e) {

                    /* Keep default message */

                }


                message.style.color = "red";

                message.innerText =
                    errorMessage;


                loginButton.disabled = false;

                loginButton.innerText =
                    "Login";

            }


        } catch (error) {


            console.error(
                "Login error:",
                error
            );


            message.style.color = "red";

            message.innerText =
                "Unable to connect to server. Make sure Spring Boot is running.";


            loginButton.disabled = false;

            loginButton.innerText =
                "Login";

        }


    });


</script>


</body>

</html>
